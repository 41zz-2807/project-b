name: project-bendahara

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-bendahara/app
    container_name: project-bendahara-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./www:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: pg15
      DB_PORT: "5432"
      DB_DATABASE: project_bendahara
      DB_USERNAME: laravel
      DB_PASSWORD: laravel123
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    networks:
      - pg15_default

  web:
    image: nginx:1.27-alpine
    container_name: project-bendahara-web
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./www:/var/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - node
    networks:
      - pg15_default

  node:
    image: node:20-alpine
    container_name: project-bendahara-node
    restart: "no"
    working_dir: /var/www
    command: sh -c "npm install && npm run build"
    volumes:
      - ./www:/var/www
    networks:
      - pg15_default

networks:
  pg15_default:
    name: pg15_default
    external: true